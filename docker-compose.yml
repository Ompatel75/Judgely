version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: judgely_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-judgely_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-judgely_password}
      POSTGRES_DB: ${POSTGRES_DB:-judgely_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgely_user -d judgely_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: judgely_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judgely_web
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://judgely_user:judgely_password@postgres:5432/judgely_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_ALWAYS_EAGER=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-3.8-flash}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-15.0}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-1024}
      - AI_THINKING_BUDGET=${AI_THINKING_BUDGET:-0}
      - AI_CACHE_TTL_SECONDS=${AI_CACHE_TTL_SECONDS:-86400}
      - AI_RATE_LIMIT_USER_RPM=${AI_RATE_LIMIT_USER_RPM:-5}
      - AI_RATE_LIMIT_USER_RPD=${AI_RATE_LIMIT_USER_RPD:-50}
      - AI_GLOBAL_RPM_LIMIT=${AI_GLOBAL_RPM_LIMIT:-10}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_CIRCUIT_BREAKER_THRESHOLD=${AI_CIRCUIT_BREAKER_THRESHOLD:-3}
      - AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS=${AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_me_in_production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judgely_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://judgely_user:judgely_password@postgres:5432/judgely_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_ALWAYS_EAGER=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-3.8-flash}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_REQUEST_TIMEOUT=${AI_REQUEST_TIMEOUT:-15.0}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-1024}
      - AI_THINKING_BUDGET=${AI_THINKING_BUDGET:-0}
      - AI_CACHE_TTL_SECONDS=${AI_CACHE_TTL_SECONDS:-86400}
      - AI_GLOBAL_RPM_LIMIT=${AI_GLOBAL_RPM_LIMIT:-10}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_CIRCUIT_BREAKER_THRESHOLD=${AI_CIRCUIT_BREAKER_THRESHOLD:-3}
      - AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS=${AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-60}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

